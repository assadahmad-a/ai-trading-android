name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AI_Trading_Android_Ready.zip'
      - 'app/src/main/assets/index.html'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o AI_Trading_Android_Ready.zip -d project

      - name: Apply latest app files
        run: |
          mkdir -p project/app/src/main/assets
          cp app/src/main/assets/index.html project/app/src/main/assets/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trading-Android-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
